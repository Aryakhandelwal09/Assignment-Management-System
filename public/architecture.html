<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Architecture — Assignment Management System</title>
<link rel="stylesheet" href="styles.css">
<style>
  .arch-wrap { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .arch-wrap { grid-template-columns: 1fr; } }
  .arch-svg { width: 100%; height: auto; display: block; }
  .node-shape { cursor: pointer; transition: opacity .15s ease; }
  .node-shape rect { stroke-width: 1.5; }
  .node-shape.dim { opacity: .25; }
  .node-shape.active rect { stroke-width: 2.5; }
  .edge { stroke: #9ca3af; stroke-width: 1.5; fill: none; transition: opacity .15s ease, stroke .15s ease, stroke-width .15s ease; }
  .edge.dim { opacity: .15; }
  .edge.lit { stroke: #2563eb; stroke-width: 2.5; }
  .n-browser rect { fill: #dbeafe; stroke: #1e40af; }
  .n-browser text.t-title { fill: #1e40af; }
  .n-server rect { fill: #f3f4f6; stroke: #4b5563; }
  .n-server text.t-title { fill: #374151; }
  .n-routes rect { fill: #ede9fe; stroke: #6d28d9; }
  .n-routes text.t-title { fill: #5b21b6; }
  .n-core rect { fill: #ffedd5; stroke: #c2410c; }
  .n-core text.t-title { fill: #9a3412; }
  .n-db rect { fill: #f3f4f6; stroke: #4b5563; }
  .n-db text.t-title { fill: #374151; }
  text.t-title { font-size: 14px; font-weight: 700; }
  text.t-sub { font-size: 11px; fill: #6b7280; }
  .panel-empty { color: #6b7280; font-size: 13px; }
  .panel h3 { margin: 0 0 4px; font-size: 16px; }
  .panel .desc { font-size: 13px; color: #374151; margin: 10px 0; line-height: 1.5; }
  .file-list { list-style: none; padding: 0; margin: 0; }
  .file-list li { font-family: monospace; font-size: 12px; background: #f9fafb; border: 1px solid #e5e7eb;
    border-radius: 5px; padding: 5px 8px; margin-bottom: 6px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Assignment Management System</div>
    <a href="/" style="color:#fff;font-size:13px;text-decoration:none;">&larr; Back to app</a>
  </div>
  <main>
    <div class="card">
      <h2>Architecture</h2>
      <p class="muted">Click a node for details. Hover to trace how a piece connects to the rest.</p>
      <div class="arch-wrap">
        <svg class="arch-svg" viewBox="0 0 620 460" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </marker>
          </defs>

          <path class="edge" data-edge="browser-server" d="M300,64 L300,80" marker-end="url(#arrow)"></path>
          <path class="edge" data-edge="routes-core" d="M290,240 L330,240" marker-end="url(#arrow)"></path>
          <path class="edge" data-edge="core-db" d="M415,330 L415,370" marker-end="url(#arrow)"></path>

          <g class="node-shape n-browser" data-node="browser">
            <rect x="220" y="20" width="160" height="44" rx="8"></rect>
            <text class="t-title" x="300" y="38" text-anchor="middle" dominant-baseline="central">Browser</text>
            <text class="t-sub" x="300" y="54" text-anchor="middle" dominant-baseline="central">public/ frontend</text>
          </g>

          <g class="n-server" data-node="server" style="pointer-events:none">
            <rect x="60" y="80" width="500" height="270" rx="20"></rect>
            <text class="t-title" x="310" y="108" text-anchor="middle" dominant-baseline="central">Express server</text>
            <text class="t-sub" x="310" y="124" text-anchor="middle" dominant-baseline="central">Routes and serves the frontend</text>
          </g>

          <g class="node-shape n-routes" data-node="routes">
            <rect x="90" y="150" width="200" height="180" rx="12"></rect>
            <text class="t-title" x="190" y="175" text-anchor="middle" dominant-baseline="central">Routes</text>
            <text class="t-sub" x="190" y="193" text-anchor="middle" dominant-baseline="central">3 route modules</text>
          </g>

          <g class="node-shape n-core" data-node="core">
            <rect x="330" y="150" width="200" height="180" rx="12"></rect>
            <text class="t-title" x="430" y="175" text-anchor="middle" dominant-baseline="central">Core logic</text>
            <text class="t-sub" x="430" y="193" text-anchor="middle" dominant-baseline="central">Shared logic and storage</text>
          </g>

          <g class="node-shape n-db" data-node="db">
            <rect x="335" y="370" width="160" height="44" rx="8"></rect>
            <text class="t-title" x="415" y="388" text-anchor="middle" dominant-baseline="central">data/db.json</text>
            <text class="t-sub" x="415" y="404" text-anchor="middle" dominant-baseline="central">JSON file storage</text>
          </g>
        </svg>

        <div class="card panel" id="panel">
          <p class="panel-empty">Click a node in the diagram to see the files and role behind it.</p>
        </div>
      </div>
    </div>
  </main>

<script>
  const DATA = {
    browser: {
      title: 'Browser',
      files: ['public/index.html', 'public/app.js', 'public/styles.css'],
      desc: 'No-framework SPA. Renders the auth screen plus the professor and student dashboards, and talks to the API over fetch — including an authenticated fetch+blob download for the CSV export.',
    },
    server: {
      title: 'Express server',
      files: ['server.js'],
      desc: 'Entry point. Parses JSON bodies, mounts the three route routers under /api, serves the static frontend, provides the SPA fallback, and has one central error handler.',
    },
    routes: {
      title: 'Routes',
      files: ['src/routes/authRoutes.js', 'src/routes/assignmentRoutes.js', 'src/routes/submissionRoutes.js'],
      desc: 'HTTP layer: auth middleware, role checks, request validation, and shaping responses differently for professors vs students. Delegates every actual rule to core logic.',
    },
    core: {
      title: 'Core logic',
      files: ['src/db.js', 'src/auth.js', 'src/status.js', 'src/csv.js'],
      desc: 'Pure, reusable logic with no HTTP concerns: JSON-file persistence, password hashing and token signing, the single source-of-truth status computation, and CSV serialization.',
    },
    db: {
      title: 'data/db.json',
      files: ['data/db.json'],
      desc: 'The database — a JSON file written atomically (temp file + rename) by src/db.js. Created and seeded with demo accounts on first launch.',
    },
  };

  const EDGES = {
    browser: ['browser-server'],
    server: ['browser-server', 'routes-core', 'core-db'],
    routes: ['routes-core'],
    core: ['routes-core', 'core-db'],
    db: ['core-db'],
  };

  const nodes = document.querySelectorAll('.node-shape[data-node]');
  const edges = document.querySelectorAll('.edge');
  let active = null;

  function setHover(id) {
    if (active) return; // a click has pinned the state; hover no-ops until cleared
    applyHighlight(id);
  }

  function applyHighlight(id) {
    const lit = id ? (EDGES[id] || []) : [];
    edges.forEach((e) => {
      const isLit = lit.includes(e.dataset.edge);
      e.classList.toggle('lit', isLit);
      e.classList.toggle('dim', id && !isLit);
    });
    nodes.forEach((n) => {
      n.classList.toggle('dim', id && n.dataset.node !== id);
    });
  }

  nodes.forEach((n) => {
    n.addEventListener('mouseenter', () => setHover(n.dataset.node));
    n.addEventListener('mouseleave', () => { if (!active) applyHighlight(null); });
    n.addEventListener('click', () => {
      const id = n.dataset.node;
      if (active === id) {
        active = null;
        nodes.forEach((x) => x.classList.remove('active'));
        applyHighlight(null);
        document.getElementById('panel').innerHTML =
          '<p class="panel-empty">Click a node in the diagram to see the files and role behind it.</p>';
        return;
      }
      active = id;
      nodes.forEach((x) => x.classList.toggle('active', x.dataset.node === id));
      applyHighlight(id);
      const d = DATA[id];
      document.getElementById('panel').innerHTML = `
        <h3>${d.title}</h3>
        <ul class="file-list">${d.files.map((f) => `<li>${f}</li>`).join('')}</ul>
        <p class="desc">${d.desc}</p>`;
    });
  });
</script>
</body>
</html>
